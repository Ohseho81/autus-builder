# 정적 배포(빌드 없음) — legacy Jekyll 은퇴(2026-07-03: ATB 셸에서 Jekyll 빌드 반복 실패·10분+ 지연 → 원인 클래스 제거)
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d
        uses: actions/deploy-pages@v4
